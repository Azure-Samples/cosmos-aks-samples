apiVersion: v1
kind: Namespace
metadata:
  name: todo-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-workload-identity
  namespace: todo-app
  annotations:
    azure.workload.identity/client-id: "{Workload Identity Client ID}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  namespace: todo-app
  labels:
    app: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: todo-workload-identity
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: todo
        image: "{ACR Name}.azurecr.io/{Image Name}:{Version}"
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        - name: TMPDIR
          value: /tmp
        - name: AzureAd__Instance
          value: https://login.microsoftonline.com/
        - name: AzureAd__TenantId
          value: "{Tenant ID}"
        - name: AzureAd__ClientId
          value: "{Microsoft Entra Web App Client ID}"
        - name: AzureAd__CallbackPath
          value: /signin-oidc
        - name: AzureAd__SignedOutCallbackPath
          value: /signout-callback-oidc
        - name: AzureAd__ClientCredentials__0__SourceType
          value: SignedAssertionFromManagedIdentity
        - name: AzureAd__ClientCredentials__0__ManagedIdentityClientId
          value: "{Workload Identity Client ID}"
        - name: CosmosEndpoint
          value: "{Cosmos DB Endpoint}"
        - name: CosmosDb__DatabaseName
          value: "{Cosmos DB Database Name}"
        - name: CosmosDb__ContainerName
          value: "{Cosmos DB Container Name}"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data-protection
          mountPath: /home/app/.aspnet/DataProtection-Keys
      nodeSelector:
        kubernetes.io/os: linux
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data-protection
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: todo
  namespace: todo-app
spec:
  selector:
    app: todo
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
