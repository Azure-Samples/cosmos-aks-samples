# This is a SecretProviderClass example using workload identity to access the key vault
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-workload-identity
  namespace: my-app
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "{Managed Identity Client ID}"
    keyvaultName: "{Resource Group Name}kv"       # Replace resource group name. Key Vault name is generated by Bicep
    cloudName: ""                        
    objects:  |
      array:
        - |
          objectName: CosmosEndpoint
          objectType: secret            
          objectVersion: ""              
    tenantId: "{Tenant Id}"              # Use the tenantId value from az account show