name: Validate application and infrastructure

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: .NET 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore with vulnerability audit
        run: >-
          dotnet restore Application/todo.sln
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: List vulnerable packages
        run: dotnet list Application/todo.sln package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build Application/todo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Application/todo.sln --configuration Release --no-build

  container:
    name: OCI container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag cosmos-aks-todo:ci Application

  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build templates
        run: |
          az bicep build --file Bicep/main.bicep
          az bicep build --file Bicep/main.test.bicep
          az bicep build --file ASO/main.bicep

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=Terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform -chdir=Terraform init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=Terraform validate -no-color

  kubernetes:
    name: Kubernetes YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: >-
            -strict
            -summary
            -ignore-missing-schemas
            Bicep/akstododeploy.yml
            Bicep/secretproviderclass.yml
            Terraform/akstododeploy.yml
            Terraform/secretproviderclass.yml
            ASO/akstodo-appdeploy.yml
            ASO/cosmos-deploy-aso.yml
